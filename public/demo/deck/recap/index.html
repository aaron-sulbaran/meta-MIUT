<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What Muse just did</title>
    <link rel="stylesheet" href="../shared/deck.css" />
    <link rel="stylesheet" href="./recap.css" />
  </head>
  <body>
    <div id="fit">
      <div id="root" data-composition-id="recap" data-width="1920" data-height="1080">
        <div id="drift">
          <div id="cam">
            <!-- What Muse just did: six moments the room watched live, each with its real screen, model, and measured time. -->
            <section class="scene" id="r1">
              <div class="r-intro" id="r-intro">
                <img class="r-mark" src="../shared/brand/meta-ai.png" alt="Meta AI" />
                <p class="r-title" id="r-title">What Muse just did</p>
              </div>
              <p class="r-header" id="r-header">What Muse just did</p>
              <div class="r-progress" id="r-progress"><i></i><i></i><i></i><i></i><i></i><i></i></div>

              <div class="phone" id="r-phone">
                <div class="screen">
                  <img id="r-s1" src="../shared/captures/recap-1-flyer.jpg" alt="" />
                  <img id="r-s2" src="../shared/captures/recap-2-walk.jpg" alt="" />
                  <img id="r-s3" src="../shared/captures/recap-3-heard.jpg" alt="" />
                  <img id="r-s4" src="../shared/captures/recap-4-replan.jpg" alt="" />
                  <img id="r-s5" src="../shared/captures/recap-5-picks.jpg" alt="" />
                  <img id="r-s6" src="../shared/captures/recap-6-hello.jpg" alt="" />
                </div>
              </div>

              <div class="r-col" id="r-col"></div>
            </section>

            <section class="scene" id="r2">
              <div class="center r-close">
                <img class="r-mark" src="../shared/brand/meta-ai.png" alt="Meta AI" />
                <p class="statement" id="r-close-a">Every one a live call to Meta&rsquo;s Muse models.</p>
                <p class="r-close-b" id="r-close-b">A recorded answer always says so on screen.</p>
              </div>
            </section>
          </div>
        </div>
        <div id="toast"></div>
      </div>
    </div>
    <script src="../shared/gsap.min.js"></script>
    <script src="../shared/sound.js"></script>
    <script src="../shared/deck.js"></script>
    <script src="./proof.js"></script>
    <script src="./recap.js"></script>
  </body>
</html>
